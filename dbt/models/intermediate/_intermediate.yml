version: 2
models:
- name: int_sales_enriched
  description: 'Order lines enriched with store, product and attributed region. E-commerce sales are attributed to the

    customer''s region; in-store sales to the store''s region.

    '
  columns:
  - name: line_id
    data_tests:
    - unique
    - not_null
  - name: region
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Northeast
          - Southeast
          - Midwest
          - West
- name: int_returns_enriched
  description: Returns joined to the original sale line; attributed to the month of the original sale.
  columns:
  - name: return_id
    data_tests:
    - unique
    - not_null
  - name: days_to_return
    data_tests:
    - not_null
- name: int_monthly_actuals
  description: Actuals by month x region x channel x category (sales plus returns).
- name: int_marketing_monthly
- name: int_inventory_valued
